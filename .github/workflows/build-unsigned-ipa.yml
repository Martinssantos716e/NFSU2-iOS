
name: Build unsigned iOS prototype

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build for iPhone (unsigned)
        working-directory: NFSU2-iOS-Prototype
        run: |
          xcodebuild -project NFSU2iOS.xcodeproj -target NFSU2iOS \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package unsigned IPA
        working-directory: NFSU2-iOS-Prototype
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NFSU2iOS.app Payload/
          zip -r NFSU2iOS-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NFSU2iOS-unsigned-ipa
          path: NFSU2-iOS-Prototype/NFSU2iOS-unsigned.ipa
